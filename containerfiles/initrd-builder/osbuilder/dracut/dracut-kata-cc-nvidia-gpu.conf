# NVIDIA drivers
add_drivers+=" nvidia-drm nvidia-modeset nvidia-uvm nvidia "
add_drivers+=" efi_secret "

# SNP
add_drivers+=" sev-guest "
# TDX
add_drivers+=" tdx-guest tsm "

# Dependencies from kata nvidia_rootfs.sh:chisseled_compute()
install_items+=" /usr/bin/nvidia-cdi-hook "
install_items+=" /usr/bin/nvidia-ctk "
install_items+=" /usr/bin/nvidia-persistenced "
install_items+=" /usr/bin/nvidia-smi "
# NVIDIA shared libraries (libnv* covers libnvidia-ml, libnvidia-cfg, libnvidia-nscq, etc.)
install_items+=" /usr/lib64/libnv* "
install_items+=" /usr/lib64/libcuda.so.* "
# System library dependencies for nvidia-persistenced and CUDA binaries
install_items+=" /lib64/libdl.so.2 "
install_items+=" /lib64/libz.so.1 "
install_items+=" /lib64/libpthread.so.0 "
install_items+=" /lib64/libresolv.so.2 "
install_items+=" /lib64/libc.so.6 "
install_items+=" /lib64/libm.so.6 "
install_items+=" /lib64/librt.so.1 "
install_items+=" /lib64/libtirpc.so.3 "
install_items+=" /lib64/libgssapi_krb5.so.2 "
install_items+=" /lib64/libkrb5.so.3 "
install_items+=" /lib64/libkrb5support.so.0 "
install_items+=" /lib64/libk5crypto.so.3 "
install_items+=" /lib64/libcom_err.so.2 "
install_items+=" /lib64/libkeyutils.so.1 "
install_items+=" /lib64/ld-linux-x86-64.so.2 "
install_items+=" /etc/netconfig "

# Dependencies from kata nvidia_rootfs.sh:chisseled_init()
install_items+=" /lib/firmware/nvidia "

# Dependencies from kata nvidia_rootfs.sh:chisseled_iptables()
install_items+=" /usr/sbin/iptables "
install_items+=" /usr/sbin/iptables-save "
install_items+=" /usr/sbin/iptables-restore "

# Dependencies from kata nvidia_rootfs.sh:chisseled_nvswitch()
install_items+=" /usr/bin/nv-fabricmanager "
install_items+=" /usr/share/nvidia/nvswitch "
install_items+=" /usr/share/nvidia/nvlsm "
install_items+=" /opt/nvidia/nvlsm/lib/libgrpc_mgr.so "
install_items+=" /opt/nvidia/nvlsm/sbin/nvlsm "

