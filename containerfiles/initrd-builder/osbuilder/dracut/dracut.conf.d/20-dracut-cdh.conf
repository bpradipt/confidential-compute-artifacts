# Runtime libraries for confidential-data-hub (CDH)
# From kata nvidia_rootfs.sh:copy_cdh_runtime_libs()

# CDH shared library dependencies (libcryptsetup and its transitive deps)
install_items+=" /lib64/libcryptsetup.so.12 "
install_items+=" /lib64/libuuid.so.1 "
install_items+=" /lib64/libdevmapper.so.1.02.1 "
install_items+=" /lib64/libselinux.so.1 "
install_items+=" /lib64/libpcre2-8.so.0 "
install_items+=" /lib64/libudev.so.1 "
install_items+=" /lib64/libcap.so.2 "
install_items+=" /lib64/libcrypto.so.3 "
install_items+=" /lib64/libz.so.1 "
install_items+=" /lib64/libzstd.so.1 "
install_items+=" /lib64/libjson-c.so.5 "
install_items+=" /lib64/libblkid.so.1 "
install_items+=" /lib64/libargon2.so.1 "
install_items+=" /lib64/libgcc_s.so.1 "
install_items+=" /lib64/libm.so.6 "
install_items+=" /lib64/libc.so.6 "

# e2fsprogs runtime libs (required by mkfs.ext4)
install_items+=" /lib64/libext2fs.so.2 "
install_items+=" /lib64/libe2p.so.2 "
install_items+=" /lib64/libss.so.2 "
install_items+=" /lib64/libcom_err.so.2 "

# mkfs.ext4 and dd are used by CDH secure_mount
install_items+=" /usr/sbin/mke2fs "
install_items+=" /usr/sbin/mkfs.ext4 "
install_items+=" /etc/mke2fs.conf "
install_items+=" /usr/bin/dd "
